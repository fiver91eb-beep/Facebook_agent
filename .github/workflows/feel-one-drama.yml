name: Feel One Turkish Drama Shorts - Buffer Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: write

concurrency:
  group: feel-one-drama-publisher
  cancel-in-progress: false

jobs:
  publish-authorized-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: pip install requests
      - name: Prepare and queue creator-authorized drama shorts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_drama_shorts.py
      - name: Save queue history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drama_upload_history.json
          git diff --cached --quiet || git commit -m "Save Feel One drama video queue history"
          git push
