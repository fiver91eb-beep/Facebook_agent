name: Sports Lover Agent - 10 Daily Native Videos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sports-agent.yml"
      - "scripts/create_and_upload.py"
      - "scripts/collect_github.py"
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: sports-lover-daily-publisher
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: pip install feedparser pillow requests
      - name: Collect latest sports stories
        run: python scripts/collect_github.py
      - name: Create and upload one native sports video
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v27.0
          MAX_VIDEOS_PER_RUN: "1"
        run: python scripts/create_and_upload.py
      - name: Save collection and upload history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_posts.json data/video_upload_history.json
          git diff --cached --quiet || git commit -m "Save sports video publishing history"
          git push
