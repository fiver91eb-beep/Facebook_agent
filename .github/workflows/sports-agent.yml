name: Sports Lover Agent - Buffer Native Videos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sports-agent.yml"
      - "scripts/create_and_upload.py"
      - "scripts/collect_github.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-lover-daily-publisher
  cancel-in-progress: false

jobs:
  create-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: pip install pillow requests feedparser
      - name: Collect latest cricket and football trends
        run: python scripts/collect_github.py
      - name: Create original trend card video and queue in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_VIDEOS_PER_RUN: "1"
        run: python scripts/create_and_upload.py
      - name: Save collection and Buffer queue history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_posts.json data/video_upload_history.json
          git diff --cached --quiet || git commit -m "Save cricket and football trend queue history"
          git push
