services:
  - type: web
    name: sports-lover-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Sports Lover Agent
      - key: AUTO_INGEST_ENABLED
        value: "true"
      - key: INGEST_INTERVAL_SECONDS
        value: "3600"
      - key: PUBLISH_ENABLED
        value: "false"
      - key: SPORTS_FEEDS
        value: '["https://feeds.bbci.co.uk/sport/rss.xml","https://feeds.bbci.co.uk/sport/football/rss.xml","https://feeds.bbci.co.uk/sport/cricket/rss.xml","https://www.skysports.com/rss/12040","https://www.skysports.com/rss/12123","https://www.skysports.com/rss/12110","https://www.skysports.com/rss/12433","https://www.cricinfo.com/rss/content/story/feeds/0.xml","https://www.formula1.com/en/latest/all.xml"]'
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUFFER_API_KEY
        sync: false
      - key: BUFFER_CHANNEL_ID
        sync: false
