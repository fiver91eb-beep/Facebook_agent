name: Sports Lover Agent - Simple Auto Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sports-agent.yml"
      - "scripts/publish_latest.py"
      - "scripts/collect_github.py"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RSS parser
        run: pip install feedparser
      - name: Collect sports links
        run: python scripts/collect_github.py
      - name: Add newest links to Buffer queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/publish_latest.py
      - name: Save collection and publishing history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_posts.json data/published_urls.json
          git diff --cached --quiet || git commit -m "Save sports agent run results"
          git push
