services:
  - type: web
    name: sports-lover-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Sports Lover Agent
      - key: PUBLISH_ENABLED
        value: "false"
      - key: SPORTS_FEEDS
        value: "[]"
      - key: BUFFER_API_KEY
        sync: false
