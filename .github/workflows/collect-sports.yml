name: Collect Sports Content

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install feed parser
        run: pip install feedparser
      - name: Collect and filter sports links
        run: python scripts/collect_github.py
      - name: Save collected content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_posts.json
          git diff --cached --quiet || git commit -m "Update collected sports content"
          git push
